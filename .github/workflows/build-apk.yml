name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create dummy google-services.json if missing
      run: |
        mkdir -p app
        if [ ! -f "app/google-services.json" ]; then
          echo '{
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef"
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly123456789" }],
              "services": { "analytics_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }' > app/google-services.json
        fi

    - name: Build with Gradle Wrapper or Fallback
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        elif [ -f "./app/gradlew" ]; then
          chmod +x ./app/gradlew
          ./app/gradlew assembleDebug --stacktrace
        else
          # Agar wrapper nahi hai toh gradle generate kar lete hain ya project build command chalate hain
          gradle wrapper
          ./gradlew assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
