name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto Setup Gradle Wrapper & Configs
      run: |
        # 1. Dummy google-services.json banana agar missing ho
        mkdir -p app
        if [ ! -f "app/google-services.json" ]; then
          echo '{
            "project_info": { "project_number": "1234567890", "project_id": "dummy-project" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef" },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly123456789" }],
              "services": { "analytics_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }' > app/google-services.json
        fi

        # 2. Khud ba khud gradlew file generate karna agar mojood na ho
        if [ ! -f "./gradlew" ] && [ ! -f "./app/gradlew" ]; then
          gradle wrapper
        fi

    - name: Build APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "./app/gradlew" ]; then
          chmod +x ./app/gradlew
          ./app/gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
