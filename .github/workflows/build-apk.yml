name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup google-services.json
      run: |
        mkdir -p app
        echo '{
          "project_info": {
            "project_number": "1234567890",
            "project_id": "voice-mimic",
            "storage_bucket": "voice-mimic.appspot.com"
          },
          "client": [{
            "client_info": {
              "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
              "android_client_info": {
                "package_name": "com.aistudio.voicemimic.qpxrtz"
              }
            },
            "oauth_client": [],
            "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly123456789" }],
            "services": { "analytics_service": { "status": 1 } }
          }],
          "configuration_version": "1"
        }' > app/google-services.json

    - name: Build APK
      run: |
        # Agar gradlew mojood nahi hai toh wrapper generate karein
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        
        # Debug keystore ka masla hal karne ke liye clean aur assembleDebug chalayein
        ./gradlew clean assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
